name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Build the Lambda package exactly as deploy does, and make sure it imports.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: ./scripts/build_lambda.sh
      # Lambda runs Python 3.12, and the package has compiled parts built for it.
      - run: cd build/lambda && uv run --no-project --python 3.12 python -I -c "import sys; sys.path.insert(0, '.'); import footnote.handler"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false && terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/main init -backend=false && terraform -chdir=infra/main validate

  # The parser against real 10-Ks, including banks that lay theirs out as annual reports.
  edgar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Fetch and split real filings
        run: uv run footnote ingest --ticker AAPL --ticker JPM --ticker GS --ticker WMT --since-year 2024
      - name: Every filing has risk factors and MD&A
        run: uv run python scripts/check_sections.py out/store
