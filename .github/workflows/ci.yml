name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Build the Lambda package exactly as deploy does, and make sure it imports.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: ./scripts/build_lambda.sh
      # Lambda runs Python 3.12, and the package has compiled parts built for it.
      - run: cd build/lambda && uv run --no-project --python 3.12 python -I -c "import sys; sys.path.insert(0, '.'); import footnote.handler, footnote.api"
      - run: ./scripts/fetch_model.sh
      - name: The real model, run from the package, finds the right passage
        run: uv run --no-project --python 3.12 python -I scripts/check_embedding.py build/lambda build/model

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false && terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/main init -backend=false && terraform -chdir=infra/main validate

  # The parser against real 10-Ks, including banks that lay theirs out as annual reports.
  edgar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Fetch and split real filings
        run: uv run footnote ingest --ticker AAPL --ticker JPM --ticker GS --ticker WMT --ticker XOM --since-year 2024
      - name: Every filing has risk factors and MD&A
        run: uv run python scripts/check_sections.py out/store
      - name: How they cut into passages
        run: uv run python scripts/chunk_stats.py out/store
      - name: Headline figures match the 10-K
        run: uv run python scripts/check_facts.py out/store

  # Real filings through real Pinecone, in a namespace of their own that's removed after.
  pinecone:
    runs-on: ubuntu-latest
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      FOOTNOTE_NAMESPACE: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: ./scripts/fetch_model.sh
      - run: uv run footnote ingest --ticker AAPL --since-year 2024
      - run: uv run footnote index --ticker AAPL
      - name: Search finds the passage that answers the question
        run: uv run python scripts/check_search.py
      - name: Remove the namespace
        if: always()
        run: uv run python -c "from footnote.embed import DIMENSION; from footnote.settings import Settings; from footnote.vectors import PineconeVectors; s = Settings(); PineconeVectors(s.pinecone_api_key, DIMENSION, namespace=s.namespace).drop_namespace()"

  # Real questions through Claude, Pinecone and the XBRL figures, traced in LangSmith.
  answers:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: footnote-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: ./scripts/fetch_model.sh
      - run: uv run footnote ingest --ticker AAPL --since-year 2023
      - name: Questions get cited answers
        run: uv run python scripts/check_answers.py
