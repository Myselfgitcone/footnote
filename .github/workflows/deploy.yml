name: deploy

# Apply infra/main and ship the Lambdas. Needs the one-time bootstrap
# (infra/bootstrap), the deploy user's key as secrets AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY, the PINECONE_API_KEY, ANTHROPIC_API_KEY and
# LANGSMITH_API_KEY secrets, and the repository variable TF_STATE_BUCKET.
on:
  push:
    branches: [main]
    paths:
      - "infra/main/**"
      - "src/**"
      - "scripts/build_lambda.sh"
      - "scripts/fetch_model.sh"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.TF_STATE_BUCKET != ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false # plain stdout, so outputs can be read into variables
      - run: ./scripts/build_lambda.sh
      # The index Lambda reads the model from the bucket. It's copied there once and
      # never replaced: vectors from two versions of a model don't compare.
      - name: Put the embedding model in the bucket, if it isn't there
        run: |
          bucket="footnote-data-$(aws sts get-caller-identity --query Account --output text)"
          if aws s3api head-object --bucket "$bucket" --key models/bge-small-en-v1.5/model.onnx > /dev/null 2>&1; then
            echo "Already in s3://$bucket/models/bge-small-en-v1.5/"
          else
            ./scripts/fetch_model.sh
            aws s3 cp build/model/ "s3://$bucket/models/bge-small-en-v1.5/" --recursive
          fi
      - run: terraform -chdir=infra/main init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=infra/main apply -auto-approve -input=false
        env:
          TF_VAR_pinecone_api_key: ${{ secrets.PINECONE_API_KEY }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
      - name: The API is up
        run: |
          url=$(terraform -chdir=infra/main output -raw ask_url)
          echo "API: $url"
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 "${url}health" && exit 0
            sleep 10
          done
          exit 1
      - name: Kick off an ingest now rather than waiting for tomorrow
        run: aws lambda invoke --function-name footnote-ingest --invocation-type Event --payload '{"max_new":40}' --cli-binary-format raw-in-base64-out /dev/null
