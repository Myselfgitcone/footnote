name: backfill

# The first load, or a rebuild after the chunker changes: run each Lambda until
# it reports nothing left. Fetching is quick; embedding takes most of the time.
on:
  workflow_dispatch:
    inputs:
      ingest:
        description: Fetch new filings first
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Fetch filings until done
        if: inputs.ingest
        run: scripts/invoke_until_done.sh footnote-ingest '{"max_new":40}' 6
      - name: Embed passages until done
        run: scripts/invoke_until_done.sh footnote-index '{"budget_s":780}' 16
