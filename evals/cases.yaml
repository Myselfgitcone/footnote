# Questions with known answers, run against the live index by `footnote evals`.
#
# figure:  the answer must cite the exact figure filed in XBRL and state it.
#          Values are from the SEC's companyfacts API, as reported in that year's
#          10-K (so NVIDIA's EPS is pre-split in fiscal 2024, post-split in 2025).
# passage: some retrieved passage from the company must contain the phrase (and
#          be in one of `items`, if given), and the answer should cite one.
# decline: out of scope, or not in the filings. The answer must not offer a
#          dollar figure.
#
# Every answer that cites sources is also judged for whether its claims are
# supported by them.

- id: aapl-revenue-2024
  kind: figure
  question: What was Apple's revenue in fiscal 2024?
  figures:
    - {ticker: AAPL, fiscal_year: 2024, metric: revenue, value: 391035000000}

