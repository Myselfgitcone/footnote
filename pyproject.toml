[project]
name = "footnote"
version = "0.1.0"
description = "Answers about SEC filings that cite their source, with numbers checked against the SEC's figures."
readme = "README.md"
authors = [{ name = "Jagadish Butukuri", email = "jagadishbutukuri11@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "fastapi>=0.160",
    "httpx>=0.27",
    "langchain-anthropic>=1.7",
    "langchain-core>=1.7",
    "langgraph>=1.2",
    "langsmith>=0.14",
    "mangum>=0.20",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pinecone>=10.0",
    "pydantic-settings>=2.6",
    "tokenizers>=0.20",
    "typer>=0.12",
]

[project.scripts]
footnote = "footnote.cli:app"

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "onnx>=1.17",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footnote"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # word lists read better as one split string

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real SEC EDGAR API (CI smoke test only)"]
